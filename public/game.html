<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1, minimum-scale=1, user-scalable=no"
    >
    <title>Prune</title>
    <link rel="modulepreload" href="game.js">
    <style>
    body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #e9e4d8;
      font-family: system-ui, sans-serif;
      color: #2b2620;
      user-select: none;
      -webkit-user-select: none;
    }
    #scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      gap: 8px;
      justify-items: center;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    #hint {
      margin: 0;
      padding: 8px 14px;
      font-size: 15px;
      background: rgb(255 255 255 / 0.85);
      border-radius: 999px;
    }
    .bar {
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: auto;
    }
    button {
      min-width: 88px;
      min-height: 44px;
      padding: 0 18px;
      font: inherit;
      font-size: 16px;
      color: #f5f1e8;
      background: #2b2620;
      border: 0;
      border-radius: 999px;
    }
    button:disabled {
      opacity: 0.35;
    }
    #cuts {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      min-height: 44px;
      padding: 0 16px;
      box-sizing: border-box;
      font-size: 16px;
      font-weight: 600;
      color: #2b2620;
      background: rgb(255 255 255 / 0.85);
      border-radius: 999px;
    }
    #stats {
      position: fixed;
      top: 8px;
      left: 8px;
      margin: 0;
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.4;
      color: #f5f1e8;
      background: rgb(0 0 0 / 0.55);
      border-radius: 6px;
      white-space: pre;
      pointer-events: none;
    }
    #next-tree {
      position: fixed;
      top: 8px;
      right: 8px;
      min-width: 0;
      min-height: 32px;
      font-size: 12px;
    }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <pre id="stats">Loading…</pre>
    <button id="next-tree" type="button">Next tree (debug)</button>
    <div id="hud">
      <p id="hint">Tap a branch to select it</p>
      <div class="bar">
        <button id="undo" type="button" disabled>Undo</button>
        <span id="cuts">0 cuts</span>
      </div>
    </div>
    <script src="game.js" type="module"></script>
  </body>
</html>
