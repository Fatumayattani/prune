<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1, minimum-scale=1, user-scalable=no"
    >
    <title>Prune</title>
    <link rel="modulepreload" href="game.js">
    <style>
    body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #e9e4d8;
      font-family: system-ui, sans-serif;
    }
    #scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #stats {
      position: fixed;
      top: 8px;
      left: 8px;
      margin: 0;
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.4;
      color: #f5f1e8;
      background: rgb(0 0 0 / 0.55);
      border-radius: 6px;
      white-space: pre;
      pointer-events: none;
    }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <pre id="stats">Loading…</pre>
    <script src="game.js" type="module"></script>
  </body>
</html>
